name: Arabic frontend and SQLite workflows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Install UI test browser
        run: npx playwright install --with-deps chrome
      - name: Exercise React with the real Rust/SQLite backend
        run: npm run test:ui
      - name: Build isolated native PDF renderer
        run: |
          docker build -f docker/Dockerfile.check -t plumbing-erp-check:stage2 .
          docker build -f docker/Dockerfile.print-check -t plumbing-erp-print:stage4 .
      - name: Verify native PDF dimensions and barcode decoding
        run: bash scripts/check-native-print.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arabic-print-review
          path: output/pdf/*.pdf
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-failures
          path: output/playwright-results/
          retention-days: 7
